# Сегменты (полигоны + JSON) для cv_dataset — без PNG-масок и overlay

dataset_dir: "C:/Users/adel/Downloads/cv_dataset/final_dataset_v5_participants"
output_dir: "C:/Users/adel/Downloads/cv_dataset/annotations/segment"
flat_output: true

model: "yolo26s-seg.pt"
device: ""

image_globs:
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.png"

exclude_dirs:
  - "annotations"
  - "runs"
  - ".git"
  - "__pycache__"

path_filters: "all"

conf: 0.25
iou: 0.45
imgsz: 640
max_det: 300
half: false

save_images: false
save_masks: false
save_overlay: false
save_labels: true
save_json: true
save_csv: true

classes:
  - person
  - bicycle
  - car
  - motorcycle
  - bus
  - truck
  - traffic light
  - stop sign
  - fire hydrant
  - parking meter
